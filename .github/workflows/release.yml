name: Release source package

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGE_NAME: "json"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kelvralang/kelvra
          ref: main
          path: .runtime/kelvra
      - name: Verify tag and manifest version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' kelvra.toml | head -n 1)"
          test -n "$version"
          test "${GITHUB_REF_NAME#v}" = "$version"
          grep -Fq "## $version" CHANGELOG.md
      - name: Build Kelvra runtime
        run: |
          cmake -S .runtime/kelvra -B .runtime/kelvra/build -DCMAKE_BUILD_TYPE=Release
          cmake --build .runtime/kelvra/build --parallel
      - name: Validate package and run tests
        shell: bash
        run: |
          set -euo pipefail
          runtime="$GITHUB_WORKSPACE/.runtime/kelvra/build/kelvra"
          version="${GITHUB_REF_NAME#v}"
          stage="$RUNNER_TEMP/stage/github.com/kelvralang/$PACKAGE_NAME"
          project="$RUNNER_TEMP/package-test"
          mkdir -p "$(dirname "$stage")" "$project"
          rsync -a --exclude .git --exclude .runtime "$GITHUB_WORKSPACE/" "$stage/"
          "$runtime" validate-package "$stage"
          sed -e "s|__PACKAGE_NAME__|$PACKAGE_NAME|g" -e "s|__PACKAGE_VERSION__|$version|g" -e "s|__PACKAGE_PATH__|$stage|g" \
            "$GITHUB_WORKSPACE/.github/package-test.toml.in" > "$project/kelvra.toml"
          (
            cd "$project"
            KELVRA_CACHE_DIR="$RUNNER_TEMP/kelvra-cache" "$runtime" run "$stage/tests/main.kel"
          )
          for fixture in "$stage"/tests/errors/*.kel; do
            [[ -e "$fixture" ]] || continue
            if (
              cd "$project"
              KELVRA_CACHE_DIR="$RUNNER_TEMP/kelvra-cache" "$runtime" run "$fixture"
            ); then
              echo "Expected failure fixture succeeded: $fixture" >&2
              exit 1
            fi
          done

  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PACKAGE_NAME: "json"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bundle package and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          bundle="$RUNNER_TEMP/$PACKAGE_NAME-$version"
          mkdir -p "$bundle"
          rsync -a --exclude .git --exclude .github --exclude build ./ "$bundle/"
          tar -C "$RUNNER_TEMP" -czf "$PACKAGE_NAME-$version.tar.gz" "$PACKAGE_NAME-$version"
          sha256sum "$PACKAGE_NAME-$version.tar.gz" > SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            json-*.tar.gz
            SHA256SUMS
          fail_on_unmatched_files: true
